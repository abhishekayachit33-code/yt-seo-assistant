# "Press" theme -- editorial/print inspired: warm paper, serif display headings,
# terracotta accent, sharp corners. Both light and dark variants are defined so
# the in-app theme toggle works.
[theme]
base = "light"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseFontSize = 16
baseFontWeight = 400
codeFontSize = "0.83rem"
headingFontSizes = ["42px", "31px", "24px", "19px", "16px", "14px"]
headingFontWeights = [900, 700, 700, 600, 600, 600]
baseRadius = "3px"
buttonRadius = "3px"
linkUnderline = true
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#C2410C", "#166534", "#B45309", "#3F4C6B", "#7E3F5F", "#0F766E", "#8C5A2B"]

[theme.light]
primaryColor = "#C2410C"
backgroundColor = "#FDFBF7"
secondaryBackgroundColor = "#F4EFE6"
codeBackgroundColor = "#F4EFE6"
textColor = "#1C1917"
linkColor = "#9A3412"
borderColor = "#E3DACB"
codeTextColor = "#3F3A34"
dataframeBorderColor = "#E3DACB"
dataframeHeaderBackgroundColor = "#F4EFE6"
redColor = "#B91C1C"
orangeColor = "#C2410C"
yellowColor = "#B45309"
greenColor = "#166534"
blueColor = "#3F4C6B"
violetColor = "#7E3F5F"
grayColor = "#78716C"

[theme.light.sidebar]
backgroundColor = "#F4EFE6"
secondaryBackgroundColor = "#EAE2D4"
codeBackgroundColor = "#EAE2D4"
borderColor = "#E3DACB"
primaryColor = "#C2410C"

[theme.dark]
primaryColor = "#C2410C"
backgroundColor = "#16130F"
secondaryBackgroundColor = "#211C16"
codeBackgroundColor = "#211C16"
textColor = "#F0EAE0"
linkColor = "#EFA37C"
borderColor = "#352E25"
codeTextColor = "#DFD7CA"
dataframeBorderColor = "#352E25"
dataframeHeaderBackgroundColor = "#211C16"
redColor = "#F87171"
orangeColor = "#EFA37C"
yellowColor = "#E0B15E"
greenColor = "#7BAE86"
blueColor = "#8C9BC0"
violetColor = "#C89BB2"
grayColor = "#A8A29A"

[theme.dark.sidebar]
backgroundColor = "#100E0B"
secondaryBackgroundColor = "#211C16"
codeBackgroundColor = "#211C16"
borderColor = "#2A241D"
primaryColor = "#C2410C"

[browser]
gatherUsageStats = false
