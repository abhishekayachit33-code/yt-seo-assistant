services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ytseo:ytseo@db:5432/ytseo
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ytseo
      POSTGRES_PASSWORD: ytseo
      POSTGRES_DB: ytseo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytseo"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
